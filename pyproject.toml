[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urh"
version = "0.1.0"
description = "Upper-Right Harness: a durable, headless agent orchestrator (Opus manager, Haiku 5.5 workers)"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
urh = "urh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)"]
addopts = "-m 'not live'"
