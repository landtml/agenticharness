name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e '.[dev]'; else pip install pytest ruff; fi
      - name: Lint
        run: ruff check .
      - name: Test
        # exit code 5 means "no tests collected", which is fine on a bare skeleton
        run: python -m pytest -q || [ $? -eq 5 ]
